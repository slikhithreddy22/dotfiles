# ─── hyprpaper.conf ───────────────────────────────────────────────────────────
# Drop your wallpaper into ~/Pictures/wallpapers/ and set the path below.
# Reload with:  hyprctl hyprpaper reload
#
# Recommended: a quiet mountain scene, misty forest, or overcast landscape.
# Something you could stare at for 8 hours without going blind.

# preload  = ~/Pictures/wallpapers/mountain.jpg
# wallpaper = ,~/Pictures/wallpapers/mountain.jpg

# Uncomment the two lines above and set the correct filename.
# Until then, hyprpaper will just run with no wallpaper (desktop stays dark).
