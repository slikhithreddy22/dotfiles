background {
    monitor =
    path = /home/likhithreddy/Pictures/wallpapers/wp2963098-itachi-anbu-wallpapers-hd.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8
    vibrancy = 0.1696
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(205, 214, 244, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(166, 173, 200, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -20
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(33, 204, 255, 0.7)
    inner_color = rgba(30, 30, 46, 0.7)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##a6adc8">Password...</span></i>
    hide_input = false
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -80
    halign = center
    valign = center
}
