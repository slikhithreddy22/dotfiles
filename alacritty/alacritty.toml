# live_config_reload = true

[window]
padding = { x = 5, y = 2 }
dynamic_padding = true
opacity = 1
# blur = true # for only hyprland
decorations = "None"
# startup_mode = "Maximized"
# option_as_alt = "None" # ignored on Linux, safe to omit

[scrolling]
history = 100000
multiplier = 5

[font]
size = 13.5
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 400
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/fish"

[env]
TERM = "xterm-256color"

[keyboard]

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
